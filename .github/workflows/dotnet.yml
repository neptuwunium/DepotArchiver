name: Build
on: [push]
jobs:
  build:
    name: "Build [${{ matrix.os }}, ${{ matrix.pargs }}]"
    strategy:
        matrix:
            os: [ubuntu-latest, macos-latest, windows-latest]
            pargs: ["--sc", ""]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: 'recursive'
    - uses: actions/setup-dotnet@v4
    - run: dotnet publish ${{ matrix.pargs }} -c Release -o ${{ github.workspace }}/Publish -f net9.0
    - uses: actions/upload-artifact@v4
      with:
        name: DepotArchiver-${{ matrix.os }}${{ matrix.pargs }}
        path: Publish
