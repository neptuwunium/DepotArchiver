name: Build
on: [ push ]
jobs:
    build:
        name: "Build [${{ matrix.os }}]"
        strategy:
            matrix:
                os: [ ubuntu-latest, macos-latest, windows-latest ]
        runs-on: ${{ matrix.os }}
        steps:
            -   uses: actions/checkout@v4
                with:
                    fetch-depth: 0
                    submodules: 'recursive'
            -   uses: actions/setup-dotnet@v4
            -   run: dotnet publish PublishTarget -c Release -o ${{ github.workspace }}/Publish/DepotArchiver-Runtime -f net9.0
            -   run: dotnet publish PublishTarget -c Release -o ${{ github.workspace }}/Publish/DepotArchiver-Standalone -f net9.0 --sc
            -   uses: actions/upload-artifact@v4
                with:
                    name: DepotArchiver-${{ matrix.os }}
                    path: Publish/DepotArchiver-Runtime
            -   uses: actions/upload-artifact@v4
                with:
                    name: DepotArchiver-${{ matrix.os }}-Standalone
                    path: Publish/DepotArchiver-Standalone
